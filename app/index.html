<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito+Sans:wght@400;600;700;900&display=swap">
<style>
:root{
  --black:#000;--ink:#111;--white:#fff;--gold:#C5A95E;--gold-soft:#F6F0DF;
  --g1:#1C1C1C;--g2:#4A4A4A;--g3:#8A8A8A;--g4:#CFCFCF;--g5:#ECEBE7;--bg:#FAF9F6;
  --ok:#2E7D4F;--ok-soft:#E5F2EA;--bad:#B3261E;--bad-soft:#FBE9E7;--warn:#9A6A00;--warn-soft:#FFF4D6;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em}
.app{min-height:100vh;display:flex;background:linear-gradient(to right,var(--black) 240px,var(--bg) 240px)}
main:focus{outline:none}
nav.side{width:240px;flex:0 0 240px;background:var(--black);color:var(--white);padding:28px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px}
.brand b{display:block;font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.06em;color:var(--gold);line-height:1;font-weight:400}
.brand span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g4)}
.navlinks{display:flex;flex-direction:column;gap:4px}
.navlinks a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:999px;color:var(--g4);text-decoration:none;font-weight:600}
.navlinks a svg{flex:0 0 18px}
.navlinks a.on{background:var(--g1);color:var(--white);font-weight:700}
.navlinks a.on svg{stroke:var(--gold)}
.badge{margin-left:auto;background:var(--gold);color:var(--black);border-radius:999px;font-size:12px;font-weight:900;padding:1px 8px}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.preview img,.preview video{width:100%;max-height:420px;object-fit:contain;background:var(--black);border-radius:10px;display:block}
.me{margin-top:auto;display:flex;gap:12px;align-items:center;padding:0 10px}
.me .av{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--g1)}
.me small{display:block;color:var(--g4);font-size:12px}
main{flex:1;min-width:0;padding:36px 44px 80px;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--g2)}
h1{margin:4px 0 0;font-size:28px;font-weight:900;line-height:1.2}
h2{margin:0;font-size:18px;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;border:1.5px solid var(--black);background:var(--white);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--black);color:var(--white)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--black)}
.btn.small{min-height:34px;padding:0 14px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--white);border:1px solid var(--g5);border-radius:var(--radius);padding:20px}
.muted{color:var(--g2)}
.tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--g5);color:var(--g1)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:#7A6223}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.notice{padding:12px 16px;border-radius:12px;background:var(--gold-soft);font-size:14px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.storylink{margin-top:8px;display:inline-flex;gap:6px;align-items:center;background:var(--gold-soft);color:#7A6223;border-radius:999px;padding:3px 10px}
.storylink::before{content:"\25CE";font-size:12px}
.sec-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sec-head h2,.sec-head h3{margin:0}
.sec-head .chev{display:inline-block;width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .15s}
.sec-head[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.sec-head .count{font-size:12px;font-weight:800;background:var(--g5);border-radius:999px;padding:2px 9px}
.sec-head .sub{margin-left:auto}
.day{padding-left:6px;border-left:2px solid var(--g5)}
.day .sec-head h3{font-size:15px}
/* queue */
.post{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;align-items:start}
.thumb{width:96px;height:120px;border-radius:10px;background:var(--g5);overflow:hidden;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .count{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.post h3{margin:0 0 4px;font-size:16px;font-weight:800}
.post .when{font-weight:700}
.post .cap{color:var(--g2);font-size:14px;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.results{display:flex;flex-direction:column;gap:4px;font-size:13px}
.actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.empty{text-align:center;padding:40px 20px;color:var(--g2)}
/* compose */
.drop{border:2px dashed var(--g4);border-radius:var(--radius);padding:28px;text-align:center;background:var(--white);cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.files{display:flex;gap:12px;flex-wrap:wrap}
.file{width:120px;display:flex;flex-direction:column;gap:6px}
.file .thumb{width:120px;height:150px}
.file .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-weight:900}
.bar{height:5px;border-radius:999px;background:var(--g5);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
input[type=text],input[type=datetime-local],select,textarea{border:1.5px solid var(--g4);border-radius:10px;padding:10px 12px;background:var(--white);width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.platform{border:1.5px solid var(--g5);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.platform.on{border-color:var(--black)}
.platform .head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.platform .head label{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
.platform input[type=checkbox]{width:18px;height:18px;accent-color:var(--black)}
.ttbox{border-top:1px solid var(--g5);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.ttbox .opt{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ttbox .opt input{flex:none}
.ttbox .opt.off{opacity:.45;cursor:not-allowed}
.ttbox .who{display:flex;align-items:center;gap:10px;font-size:14px}
.ttbox .who img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--g5)}
.declare{font-size:13px;color:var(--g1)}
.declare a{color:inherit;font-weight:700}
.counter{font-size:12px;color:var(--g3);text-align:right}
.counter.over{color:var(--bad);font-weight:700}
.checks li{margin:4px 0}
.seg{align-self:flex-start;display:inline-flex;border:1.5px solid var(--black);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--white);padding:8px 16px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--black);color:var(--white)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--g5);border-left:1px solid var(--g5);background:var(--white);border-radius:var(--radius);overflow:hidden}
.cal .dow{padding:10px;font-size:12px;font-weight:800;color:var(--g2);border-right:1px solid var(--g5);border-bottom:1px solid var(--g5);background:var(--bg)}
.cal .day{min-height:112px;padding:8px;border-right:1px solid var(--g5);border-bottom:1px solid var(--g5);display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--bg);color:var(--g3)}
.cal .day.today .n{background:var(--gold);color:var(--black);border-radius:999px;padding:0 7px}
.cal .n{font-size:12px;font-weight:800;align-self:flex-start}
.cal .ev{border:0;text-align:left;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;cursor:pointer;background:var(--black);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.done{background:var(--ok-soft);color:var(--ok)}
.cal .ev.failed,.cal .ev.partial{background:var(--bad-soft);color:var(--bad)}
.cal .ev.draft{background:var(--white);color:var(--ink);border:1.5px dashed var(--warn)}
.cal .ev.cancelled{background:var(--g5);color:var(--g3);text-decoration:line-through}
/* accounts */
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.acct .name{font-size:18px;font-weight:900;margin:6px 0 2px;word-break:break-word}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .b{display:grid;grid-template-columns:56px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bars .b i{display:block;height:10px;border-radius:999px;background:var(--gold)}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--white);padding:12px 20px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){
  .app{flex-direction:column;background:var(--bg)}
  nav.side{width:auto;flex:none;height:auto;position:static;padding:14px 16px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
  .brand b{font-size:26px}.brand span,.me{display:none}
  .navlinks{flex-direction:row;flex-wrap:wrap}
  .navlinks a{min-height:38px;padding:0 12px;font-size:14px}
  main{padding:24px 16px 80px}
  .grid2{grid-template-columns:1fr}
  .post{grid-template-columns:72px minmax(0,1fr)}
  .post .thumb{width:72px;height:90px}
  .post .actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .cal .day{min-height:76px;padding:4px}
  .cal .ev{font-size:10px;padding:2px 4px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand"><b>Scheduler</b><span>IG · FB · TIKTOK</span></div>
    <div class="navlinks">
      <a href="#queue" data-route="queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Queue</a>
      <a href="#new" data-route="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New post</a>
      <a href="#calendar" data-route="calendar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      <a href="#accounts" data-route="accounts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Accounts</a>
    </div>
    <div class="me"><div class="av" aria-hidden="true">SC</div><div><b>Szymon Cabaj</b><small>REALTOR® · Realty ONE Group</small></div></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAMES = {instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok"};
const FORMAT_NAMES = {feed: "Photo post", reel: "Reel", story: "Story", carousel: "Carousel", post: "Photo post", video: "Video", draft: "Draft to inbox", direct: "Post directly"};
const STATUS = {pending: ["Approved · scheduled", "gold"], done: ["Posted", "ok"], partial: ["Partly posted", "warn"], failed: ["Failed", "bad"], cancelled: ["Cancelled", ""]};
const FAIR_HOUSING = ["adults only", "no children", "no kids", "perfect for families", "ideal for families", "singles", "bachelor", "christian", "exclusive neighborhood", "safe neighborhood", "walking distance to church", "mature", "able-bodied", "no wheelchairs", "english speaking"];
const BROKERAGE = "realty one group";

let openId = null;
const S = {posts: [], status: null, best: null, loading: true, error: "", month: null, compose: null, creator: null};
// Served by the laptop (http://127.0.0.1:8765) or from the published copy on github.io, which talks to the laptop.
const LOCAL = "http://127.0.0.1:8765";
const BASE = location.protocol === "https:" ? LOCAL : "";
const OFFLINE = "Can't reach the Scheduler on this computer. Start it with py -m scheduler.web, and if Chrome asks, allow this site to connect to your computer.";

async function api(path, opts = {}) {
  const init = {method: opts.method || "GET", headers: {}};
  if (opts.body !== undefined) {
    init.method = opts.method || "POST";
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  if (init.method !== "GET") init.headers["X-Scheduler"] = "1";
  let r;
  try { r = await fetch(BASE + path, {...init, targetAddressSpace: "loopback"}); }
  catch (e) { throw new Error(OFFLINE); }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.setAttribute("role", "status");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3500);
}

function modal(html, onMount) {
  openId = null;
  const layer = $("#layer");
  layer.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="card">${html}</div></div>`;
  const m = layer.firstElementChild;
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) close(); });
  onMount && onMount(m.firstElementChild, close);
  const f = m.querySelector("button, input, textarea, select");
  f && f.focus();
  return close;
}

// ---------- data ----------
let pollTimer = null;
async function loadPosts(quiet) {
  try {
    const d = await api("/api/posts");
    S.posts = d.posts; S.error = "";
  } catch (e) {
    S.error = e.message;
  }
  S.loading = false;
  if (!quiet || ["queue", "calendar"].includes(route()) || (route() === "review" && !S.compose)) render();
  else { const nb = $('.navlinks a[data-route="queue"] .badge'); const n = S.posts.filter(p => p.status === "pending" && !p.approved).length; if (nb) { nb.textContent = n || ""; nb.hidden = !n; } }
  refreshOpenPost();
  clearTimeout(pollTimer);
  const busy = S.posts.some(p => p.publishing);
  pollTimer = setTimeout(() => loadPosts(true), busy ? 4000 : 60000);
}
async function loadStatus() {
  S.status = null; if (route() === "accounts") render();
  try { S.status = await api("/api/status"); } catch (e) { S.status = {error: e.message}; }
  if (route() === "accounts") render();
}
async function loadBest() {
  if (S.best) return S.best;
  try { S.best = await api("/api/best-times"); } catch (e) { S.best = {hours: [], error: e.message}; }
  return S.best;
}

// ---------- shared bits ----------
function thumb(media) {
  const m = media[0];
  if (!m) return `<div class="thumb"></div>`;
  const inner = m.type === "video"
    ? `<video src="${esc(m.url)}#t=0.5" muted preload="metadata" playsinline></video>`
    : `<img src="${esc(m.url)}" alt="" loading="lazy">`;
  return `<div class="thumb">${inner}${media.length > 1 ? `<span class="count">${media.length}</span>` : ""}</div>`;
}
function statusChip(p) {
  if (p.status === "pending" && !p.approved) return `<span class="chip warn"><span class="dot"></span>Needs approval</span>`;
  if (p.publishing) return `<span class="chip gold"><span class="spin"></span> Publishing</span>`;
  if (p.status === "pending" && Object.keys(p.results).length && !Object.values(p.results).some(r => r.status !== "done") && Date.parse(p.scheduled_for) <= Date.now()) {
    const left = Object.keys(p.platforms).filter(k => !p.results[k]).map(k => NAMES[k]);
    return `<span class="chip gold"><span class="dot"></span>Sending · ${esc(left.join(", "))} next</span>`;
  }
  if (p.status === "pending" && Object.values(p.results).some(r => r.status === "done")) {
    const left = Object.keys(p.platforms).filter(k => !(p.results[k] && p.results[k].status === "done")).map(k => NAMES[k]);
    return `<span class="chip warn"><span class="dot"></span>Partly posted · ${esc(left.join(", "))} still to go</span>`;
  }
  const [label, cls] = STATUS[p.status] || [p.status, ""];
  return `<span class="chip ${cls}"><span class="dot"></span>${label}</span>`;
}
function firstCaption(p) {
  for (const k of ["instagram", "facebook", "tiktok"]) if (p.targets[k] && p.targets[k].caption) return p.targets[k].caption;
  return "";
}
function resultLine(p, k) {
  const r = p.results[k];
  const fmt = FORMAT_NAMES[p.platforms[k]] || p.platforms[k];
  if (!r) return `<div><b>${NAMES[k]}</b> <span class="muted">· ${esc(fmt)}${Object.keys(p.results).length && p.status === "pending" && !p.publishing ? " · not sent yet, it goes out on GitHub's next run" : ""}</span></div>`;
  if (r.status === "done") {
    const link = p.links[k];
    const what = k === "tiktok" && r.mode === "draft" ? "in your TikTok inbox, open the app and tap Post" : "posted";
    return `<div><b>${NAMES[k]}</b> <span class="chip ok">✓ ${what}</span> ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">View</a>` : ""}</div>`;
  }
  return `<div><b>${NAMES[k]}</b> <span class="chip bad">${r.attempts >= 3 ? "Gave up" : "Will retry"}</span> <span class="muted">${esc(r.error || "")}</span></div>`;
}
// Stories made from a post with "Also post as a full-screen story" (older ones are matched by title).
function storiesOf(id, title) {
  return S.posts.filter(x => x.id !== id && x.status !== "cancelled" &&
    (x.story_of === id || (!x.story_of && title && (x.title || "").startsWith(title + " (story"))));
}
function storyParent(p) {
  if (p.story_of) return S.posts.find(x => x.id === p.story_of) || null;
  const m = (p.title || "").match(/^(.*) \(story( \d+\/\d+)?\)$/);
  return m ? S.posts.find(x => x.id !== p.id && x.title === m[1]) || null : null;
}
function storyLine(p) {
  const kids = storiesOf(p.id, p.title);
  if (kids.length) {
    const first = kids.slice().sort((a, b) => a.scheduled_for.localeCompare(b.scheduled_for))[0];
    return `<div class="tiny storylink">${kids.length > 1 ? `${kids.length} stories scheduled, from` : "Story scheduled for"} <b>${esc(first.when_local)}</b></div>`;
  }
  const parent = storyParent(p);

function postCard(p, opts = {}) {

}

async function postAction(id, act, after) {

  if (act === "delete") {
    modal(`<h2>Delete this post?</h2><p class="muted">“${esc(p.title || firstCaption(p).slice(0, 80) || "Untitled")}” is removed from the scheduler. Nothing was posted, so nothing changes on Instagram, Facebook or TikTok.</p>

      (el, close) => $("#yes", el).onclick = async () => {

      <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Keep it</button><button class="btn primary" id="yes">Cancel post</button></div>`,
      (el, close) => $("#yes", el).onclick = async () => {

      (el, close) => $("#yes", el).onclick = async () => {

        catch (e) { toast(e.message, true); }

        catch (e) { toast(e.message, true); }
      });
  }
}

const LIMITS = {instagram: 2200, facebook: 63206, tiktok: 2200};
function checks(c) {
  const o = options(c), out = [];
  const active = ["instagram", "facebook", "tiktok"].filter(k => c.on[k] && o[k].length);
  if (!c.files.length) out.push(["bad", "Add a photo or video."]);
  if (c.files.some(f => f.error)) out.push(["bad", "Remove the files that failed to upload."]);
  if (c.files.some(f => !f.media && !f.error)) out.push(["warn", "Waiting for uploads to finish…"]);
  if (c.files.length && !active.length) out.push(["bad", c.files.length > 10 ? "Use 10 files or fewer." : "Pick at least one platform."]);
  const stories = active.filter(k => isStory(c, k));
  const twin = c.alsoStory ? storyTwin(c) : [];
  if (twin.length) out.push(["info", `${storyInfo(c).text.replace(" No caption.", "")} Make sure Realty ONE Group is visible${kinds(c).videos ? ", and keep videos to 60 seconds or less" : ""}.`]);
  if (stories.length) out.push(["info", `${stories.map(k => NAMES[k]).join(" and ")} ${stories.length > 1 ? "stories don't" : "story doesn't"} show a caption. Make sure Realty ONE Group is visible in the ${kinds(c).videos ? "video" : "photo"}.`]);
  for (const k of active) {
    if (isStory(c, k)) continue;
    const cap = captionFor(c, k);
    if (!cap.trim()) out.push(["bad", `${NAMES[k]} caption is empty.`]);
    else if (!cap.toLowerCase().includes(BROKERAGE)) out.push(["bad", `${NAMES[k]} caption doesn't mention Realty ONE Group.`]);
    if (cap.length > LIMITS[k]) out.push(["bad", `${NAMES[k]} caption is ${cap.length - LIMITS[k]} characters too long.`]);
    const tags = (cap.match(/#\w+/g) || []).length;
    if (k === "instagram" && tags > 30) out.push(["bad", "Instagram allows 30 hashtags at most."]);
    const hits = FAIR_HOUSING.filter(w => cap.toLowerCase().includes(w));
    if (hits.length) out.push(["warn", `${NAMES[k]}: double-check “${hits.join("”, “")}” for Fair Housing.`]);
  }
  if (c.on.tiktok && o.tiktok.length) {
    if (isDirect(c)) out.push(...ttProblems(c));
    else out.push(["info", "TikTok goes to your inbox as a draft. Open the app and tap Post."]);
  }
  if (c.whenMode === "later") {
    const t = Date.parse(c.when);
    if (!c.when || isNaN(t)) out.push(["bad", "Pick a date and time."]);
    else if (t < Date.now() - 5 * 60e3) out.push(["bad", "That time is in the past."]);
    else { const h = new Date(t).getHours(); if (h < 5 || h >= 22) out.push(["info", "Scheduled posts go out between 5 AM and 10 PM, so this one will publish at about 5 AM."]); }
  }
  return {list: out, ok: !out.some(x => x[0] === "bad" || (x[0] === "warn" && x[1].startsWith("Waiting"))), active};
}

function uploadFile(c, f) {
  const xhr = new XMLHttpRequest();
  xhr.open("POST", BASE + "/api/upload?name=" + encodeURIComponent(f.name));
  xhr.setRequestHeader("X-Scheduler", "1");
  xhr.upload.onprogress = e => { if (e.lengthComputable) { f.progress = Math.round(e.loaded / e.total * 100); const bar = document.querySelector(`.file:nth-child(${c.files.indexOf(f) + 1}) .bar i`); if (bar) bar.style.width = f.progress + "%"; } };
  xhr.onload = () => {
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) f.media = d; else f.error = d.error || "Upload failed.";
    if (route() === "new") render();
  };
  xhr.onerror = () => { f.error = "Upload failed. Is the scheduler window still open?"; if (route() === "new") render(); };
  xhr.send(f.file);
}
function addFiles(list) {
  const c = S.compose;
  for (const file of list) {
    const ext = file.name.split(".").pop().toLowerCase();
    const type = ["mp4", "mov", "m4v"].includes(ext) ? "video" : ["jpg", "jpeg", "png", "webp"].includes(ext) ? "image" : null;
    if (!type) { toast(`${file.name}: use JPG, PNG, MP4 or MOV.`, true); continue; }
    const f = {file, name: file.name, type, preview: URL.createObjectURL(file), progress: 0, media: null, error: ""};
    c.files.push(f);
    uploadFile(c, f);
  }
  render();
}
function bindCompose() {

    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };

    const ch = checks(c);
    const box = $(".checks", $("#approve").parentElement);
    box.innerHTML = ch.list.length ? ch.list.map(([lvl, msg]) => `<li><span class="chip ${lvl === "info" ? "" : lvl}">${lvl === "bad" ? "Fix" : lvl === "warn" ? "Check" : "Note"}</span> ${esc(msg)}</li>`).join("") : `<li><span class="chip ok">✓</span> Looks good.</li>`;
    $("#approve").disabled = !ch.ok || c.saving;
    $("#savedraft").disabled = !draftOk(c) || c.saving;
    document.querySelectorAll("[data-count]").forEach(el => { const k = el.dataset.count, n = captionFor(c, k).length; el.textContent = `${n} / ${LIMITS[k]}`; el.classList.toggle("over", n > LIMITS[k]); });
  };

function buildTargets(c, active) {
  const o = options(c), targets = {};
  for (const k of active) {
    const t = {caption: isStory(c, k) ? "" : captionFor(c, k)};
    if (k === "tiktok") t.mode = c.fmt.tiktok || "draft"; else t.format = c.fmt[k] || o[k][0];
    if (k === "instagram" && c.firstComment.trim()) t.first_comment = c.firstComment.trim();
    if (k === "tiktok" && t.mode === "direct") {
      const info = (S.creator && S.creator.info) || {};
      Object.assign(t, {privacy_level: c.tt.privacy, allow_comment: c.tt.comment && !info.comment_disabled,
        allow_duet: c.tt.duet && !info.duet_disabled, allow_stitch: c.tt.stitch && !info.stitch_disabled,
        brand_organic: c.tt.disclose && c.tt.organic, brand_content: c.tt.disclose && c.tt.branded});

function activePlatforms(c) { const o = options(c); return ["instagram", "facebook", "tiktok"].filter(k => c.on[k] && o[k].length); }
function draftOk(c) {
  return c.files.length && c.files.every(f => f.media) && activePlatforms(c).length && (c.whenMode === "now" || (c.when && !isNaN(Date.parse(c.when))));
}
async function submitCompose(approveIt) {
  const c = S.compose;
  const targets = buildTargets(c, activePlatforms(c));
  const now = approveIt && c.whenMode === "now";
  const body = {targets, title: c.title, when: c.whenMode === "now" ? "now" : c.when, approve: approveIt, publish_now: now};
  c.saving = true; render();
  try {
    const alsoStory = c.alsoStory && storyTwin(c).length > 0;
    if (c.editId) await api(`/api/posts/${c.editId}/edit`, {body: {...body, also_story: alsoStory}});
    else await api("/api/posts", {body: {...body, media: c.files.map(f => f.media), also_story: alsoStory}});
    S.compose = null;
    const extra = c.alsoStory && storyTwin(c).length ? (c.files.length > 1 ? " The stories are in the queue too." : " The story is in the queue too.") : "";

}
function approve() {

    <div class="stack">${ch.active.map(k => `<div class="platform on"><div class="head"><b>${NAMES[k]}</b><span class="chip">${FORMAT_NAMES[targets[k].format || targets[k].mode]}${targets[k].mode === "direct" ? " · " + esc(PRIVACY[targets[k].privacy_level] || "") : ""}</span></div><div style="white-space:pre-wrap;font-size:14px">${targets[k].format === "story" ? `<span class="muted">Story, no caption</span>` : esc(targets[k].caption)}</div></div>`).join("")}${c.alsoStory && storyTwin(c).length ? `<div class="platform on"><div class="head"><b>${storyTwin(c).map(k => NAMES[k]).join(" + ")}</b><span class="chip">${storyInfo(c).chip}</span></div><div class="muted tiny">Full screen, no caption.</div></div>` : ""}</div>

// ---------- routing ----------
function route() { return (location.hash || "#queue").slice(1).split("/")[0]; }
function routeArg() { return (location.hash || "").slice(1).split("/")[1] || ""; }
function render() {
  const r = route();
  const navR = r === "review" ? "queue" : r;
  document.querySelectorAll(".navlinks a").forEach(a => { a.classList.toggle("on", a.dataset.route === navR); a.toggleAttribute("aria-current", a.dataset.route === navR); });
  const nDrafts = S.posts.filter(p => p.status === "pending" && !p.approved).length;
  const qa = $('.navlinks a[data-route="queue"]'); if (qa) { let b = $(".badge", qa); if (!b) { b = document.createElement("span"); b.className = "badge"; qa.appendChild(b); } b.textContent = nDrafts || ""; b.hidden = !nDrafts; b.title = nDrafts + " waiting for approval"; }
  const main = $("#main");
  if (r === "new") {
    if (!S.compose || S.compose.editId) S.compose = newCompose();
    main.innerHTML = viewCompose(); bindCompose();
  }
  else if (r === "review") {
    const id = routeArg();
    if (!S.compose || S.compose.editId !== id) {
      const p = S.posts.find(x => x.id === id);
      if (!p) { main.innerHTML = S.loading ? `<div class="card empty"><span class="spin"></span> Loading…</div>` : `<div class="card empty"><p><b>That post isn't in the queue any more.</b></p><a class="btn primary" href="#queue">Back to the queue</a></div>`; return; }
      if (p.status !== "pending" || Object.keys(p.results).length) { location.hash = "#queue"; toast("That post has already started going out.", true); return; }
      S.compose = composeFromPost(p);
    }
    main.innerHTML = viewCompose(); bindCompose();
  }
  else if (r === "calendar") {
    main.innerHTML = viewCalendar();
    $("#prev").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); render(); };
    $("#next").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); render(); };
    $("#thismonth").onclick = () => { S.month = null; render(); };
    $("#refresh").onclick = () => { toast("Refreshing…"); loadPosts(); };
    document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
      const p = S.posts.find(x => x.id === b.dataset.open);
      if (p) openPost(p.id);
    });
  }
  else if (r === "accounts") {
    main.innerHTML = viewAccounts();
    $("#recheck").onclick = () => { loadStatus(); };
    $("#ttlink").onclick = async () => { try { const d = await api("/api/tiktok/link"); window.open(d.url, "_blank", "noopener"); } catch (e) { toast(e.message, true); } };
    $("#ttgo").onclick = async () => { try { await api("/api/tiktok/code", {body: {code: $("#ttcode").value}}); toast("TikTok connected."); loadStatus(); } catch (e) { toast(e.message, true); } };
    if (!S.best) loadBest().then(() => route() === "accounts" && render());
  }
  else {
    main.innerHTML = viewQueue(); const rb = $("#refresh"); if (rb) rb.onclick = () => { toast("Refreshing…"); loadPosts(); };
    document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => toggleSec(b.dataset.sec, b.dataset.dflt === "1"));
  }
}
window.addEventListener("hashchange", () => { render(); if (route() === "accounts" && !S.status) loadStatus(); $("#main").focus({preventScroll: true}); window.scrollTo(0, 0); });
render();
loadPosts();
if (route() === "accounts") loadStatus();
</script>
</body>
</html>
